<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Catalog | KEN KONVEKSI</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/catalog.css" />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <header class="navbar">
      <a href="index.html" class="logo"> KEN<span>KONVEKSI</span> </a>

      <nav>
        <a href="index.html">Home</a>

        <a href="catalog.html" class="active"> Catalog </a>

        <a href="outfit.html"> Outfit </a>

        <a href="#"> About </a>
      </nav>

      <div class="nav-actions">
        <button class="search-btn" type="button">🔍</button>

        <button class="cart-btn" type="button">
          🛒
          <span class="cart-count">0</span>
        </button>
      </div>
    </header>

    <!-- ================= CATALOG HEADER ================= -->

    <main>
      <section class="catalog-header">
        <div>
          <p class="catalog-label">KEN KONVEKSI COLLECTION</p>

          <h1>CATALOG</h1>

          <p class="catalog-description">
            Explore our collection of selected clothing and personal wardrobe
            pieces.
          </p>
        </div>
      </section>

      <!-- ================= CATALOG CONTENT ================= -->

      <section class="catalog-section">
        <!-- ================= FILTER SIDEBAR ================= -->

        <aside class="filter-sidebar">
          <div class="filter-title">
            <h2>FILTER</h2>

            <button id="resetFilter" type="button">Reset</button>
          </div>

          <!-- SEARCH -->

          <div class="filter-group">
            <label for="searchInput"> SEARCH </label>

            <input
              type="text"
              id="searchInput"
              placeholder="Search clothing..."
            />
          </div>

          <!-- CATEGORY -->

          <div class="filter-group">
            <label> CATEGORY </label>

            <div class="category-list">
              <button
                type="button"
                class="category-btn active"
                data-category="all"
              >
                All
              </button>

              <button type="button" class="category-btn" data-category="tshirt">
                T-Shirt
              </button>

              <button type="button" class="category-btn" data-category="hoodie">
                Hoodie
              </button>

              <button type="button" class="category-btn" data-category="jacket">
                Jacket
              </button>

              <button type="button" class="category-btn" data-category="pants">
                Pants
              </button>
            </div>
          </div>

          <!-- SIZE -->

          <div class="filter-group">
            <label> SIZE </label>

            <div class="size-options">
              <button type="button" class="size-btn active" data-size="all">
                Semua
              </button>

              <button type="button" class="size-btn" data-size="S">S</button>

              <button type="button" class="size-btn" data-size="M">M</button>

              <button type="button" class="size-btn" data-size="L">L</button>

              <button type="button" class="size-btn" data-size="XL">XL</button>
            </div>
          </div>

          <!-- CONDITION -->

          <div class="filter-group">
            <label for="conditionFilter"> CONDITION </label>

            <select id="conditionFilter">
              <option value="all">All Condition</option>

              <option value="new">New</option>

              <option value="preloved">Pre-Loved</option>
            </select>
          </div>
        </aside>

        <!-- ================= PRODUCTS ================= -->

        <div class="catalog-products">
          <!-- TOP -->

          <div class="catalog-top">
            <p id="productCount">0 produk</p>

            <select id="sortProducts">
              <option value="featured">Produk Terbaru</option>

              <option value="price-low">Harga Terendah</option>

              <option value="price-high">Harga Tertinggi</option>
            </select>
          </div>

          <!-- PRODUCT GRID -->

          <div class="catalog-grid" id="catalogProducts">
            <!--
              Produk dari Admin akan
              otomatis muncul di sini.
            -->
          </div>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->

    <footer>
      <div class="footer-logo">KEN KONVEKSI</div>

      <p>Personal Clothing Collection</p>

      <p class="copyright">© 2026 KEN KONVEKSI. All rights reserved.</p>
    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/catalog.js"></script>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pesanan | Admin KEN KONVEKSI</title>

    <!-- =====================================================
         CSS ADMIN
    ====================================================== -->

    <link rel="stylesheet" href="../css/admin.css" />

    <link rel="stylesheet" href="../css/admin-orders.css" />
  </head>

  <body>
    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">
      <div class="admin-logo">
        KEN
        <span>KONVEKSI</span>
      </div>

      <nav>
        <a href="index.html"> Dashboard </a>

        <a href="orders.html" class="active"> Pesanan </a>

        <a href="products.html"> Produk </a>

        <a href="add-product.html"> + Tambah Produk </a>
      </nav>

      <div class="sidebar-bottom">
        <a href="../index.html"> ← Lihat Website </a>
      </div>
    </aside>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="admin-main">
      <!-- ===================================================
           HEADER
      ==================================================== -->

      <header class="admin-header">
        <div>
          <span> ADMIN PANEL </span>

          <h1>Pesanan</h1>
        </div>

        <div class="admin-user">Admin</div>
      </header>

      <!-- ===================================================
           FILTER
      ==================================================== -->

      <div class="admin-order-filter">
        <button class="admin-filter active" data-status="all" type="button">
          Semua
        </button>

        <button
          class="admin-filter"
          data-status="Menunggu Pembayaran"
          type="button"
        >
          Menunggu Pembayaran
        </button>

        <button class="admin-filter" data-status="Diproses" type="button">
          Diproses
        </button>

        <button class="admin-filter" data-status="Dikirim" type="button">
          Dikirim
        </button>

        <button class="admin-filter" data-status="Selesai" type="button">
          Selesai
        </button>

        <button class="admin-filter" data-status="Dibatalkan" type="button">
          Dibatalkan
        </button>
      </div>

      <!-- ===================================================
           ORDER LIST
      ==================================================== -->

      <section id="adminOrders">
        <div class="admin-orders-empty">Memuat pesanan...</div>
      </section>
    </main>

    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =====================================================
         SHARED SUPABASE CONFIG
    ====================================================== -->

    <script src="supabase-config.js"></script>

    <!-- =====================================================
         ADMIN AUTH
    ====================================================== -->

    <script src="auth.js"></script>

    <!-- =====================================================
         ADMIN ORDERS JS
    ====================================================== -->

    <script src="../js/admin-orders.js"></script>
  </body>
</html>
